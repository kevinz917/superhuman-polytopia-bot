[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "polytopia-bot"
version = "0.1.0"
description = "GPU-native Polytopia simulation and language-policy research"
requires-python = ">=3.11"
dependencies = ["jax==0.11.2", "numpy>=2.1"]

[project.optional-dependencies]
test = ["pytest>=9,<10"]
skirmish = ["mini-swe-agent==2.4.6", "modal==1.5.2", "wasmtime==38.0.0"]
skirmish-harbor = ["harbor==0.25.0", "mini-swe-agent==2.4.6", "wasmtime==38.0.0", "httpx[socks]>=0.28,<1"]
skirmish-daytona = ["daytona==0.226.0"]
cuda = ["jax[cuda12]==0.11.2; sys_platform == 'linux'"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"polytopia_bot.gpu" = ["rules.json"]
"polytopia_bot.studio" = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
