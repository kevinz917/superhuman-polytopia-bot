[project]
name = "polytopia-sft-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.8.0",
  "transformers==4.57.1",
  "peft==0.17.1",
  "accelerate==1.10.1",
  "liger-kernel==0.6.3",
  "pytest==8.4.2",
  "requests[socks]==2.34.2",
